[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decodaitengu"
version = "1.4.0"
description = "DecoDaiTengu - dive decompression library (fork of DecoTengu)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Artur Wroblewski", email = "wrobell@pld-linux.org" },
]
keywords = ["diving", "dive", "decompression", "buhlmann", "gradient-factors"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "hypothesis>=6.0",
]

[project.urls]
Repository = "https://github.com/notionparallax/decodaitengu"

[tool.ruff]
target-version = "py310"
line-length = 99
exclude = ["doc/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["decodaitengu"]

[tool.pytest.ini_options]
testpaths = ["decodaitengu/tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "decodaitengu.tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
disallow_untyped_calls = false

[tool.hatch.build.targets.wheel]
packages = ["decodaitengu"]
