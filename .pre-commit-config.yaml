repos:
  - repo: local
    hooks:
      - id: ruff-check-ci
        name: ruff check (ci parity)
        entry: .venv/Scripts/python.exe -m ruff check decodaitengu/
        language: system
        pass_filenames: false
      - id: ruff-format-check-ci
        name: ruff format --check (ci parity)
        entry: .venv/Scripts/python.exe -m ruff format --check decodaitengu/
        language: system
        pass_filenames: false
