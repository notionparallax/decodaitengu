name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate release notes entry
        shell: bash
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md is required for publishing." >&2
            exit 1
          fi

          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          if ! grep -Eq "^##[[:space:]]+(v)?${VERSION}([[:space:]]|$)" RELEASE_NOTES.md; then
            echo "Missing release notes section for ${TAG} in RELEASE_NOTES.md" >&2
            echo "Add a heading like: ## ${TAG}" >&2
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing (OIDC) — no API token needed in secrets
